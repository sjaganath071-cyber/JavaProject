<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Approval | Defense Logistics</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7fb; margin: 0; padding: 24px; color: #1f2937; }
        .container { max-width: 680px; margin: 0 auto; }
        .panel { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 10px rgba(15,23,42,0.08); }
        form { display: grid; gap: 12px; }
        label { display: grid; gap: 6px; font-weight: 600; }
        input, select, textarea { padding: 9px 10px; border: 1px solid #cbd5e1; border-radius: 8px; }
        textarea { min-height: 100px; resize: vertical; }
        .btn { display: inline-block; padding: 10px 16px; border-radius: 8px; text-decoration: none; background: #1d4ed8; color: #fff; border: none; cursor: pointer; }
        .btn.secondary { background: #475569; }
        .alert { padding: 12px 14px; border-radius: 8px; margin-bottom: 12px; }
        .alert.error { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
<div class="container">
    <div class="panel">
        <h1>Record Approval Decision</h1>
        <a class="btn secondary" th:href="@{/approvals}">Back to Approvals</a>

        <div th:if="${#fields.hasErrors('*')}" class="alert error">
            <ul>
                <li th:each="err : ${#fields.errors('*')}"><span th:text="${err}"></span></li>
            </ul>
        </div>

        <form th:action="@{/approvals}" th:object="${approval}" method="post">
            <label>
                Request ID
                <select th:field="*{requestId}">
                    <option value="">Select a pending request</option>
                    <option th:each="request : ${pendingRequests}"
                            th:value="${request.id}"
                            th:text="${request.requestCode + ' - ' + request.requestingUnit + ' (' + request.priority + ')'}"></option>
                </select>
            </label>

            <label>
                Approver Name
                <input type="text" th:field="*{approverName}" placeholder="Approver name">
            </label>

            <label>
                Decision
                <select th:field="*{decision}">
                    <option value="">Choose decision</option>
                    <option value="Approved">Approved</option>
                    <option value="Rejected">Rejected</option>
                </select>
            </label>

            <label>
                Comments
                <textarea th:field="*{comments}" placeholder="Optional comments"></textarea>
            </label>

            <div>
                <button type="submit" class="btn">Save approval</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
