<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Allocation | Defense Logistics</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7fb; margin: 0; padding: 24px; color: #1f2937; }
        .container { max-width: 1120px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { margin: 0; }
        .btn { display: inline-block; padding: 10px 16px; border-radius: 8px; text-decoration: none; background: #1d4ed8; color: #fff; font-weight: 600; }
        .btn.secondary { background: #475569; }
        .panel { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 10px rgba(15,23,42,0.08); margin-top: 18px; }
        .grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #e5e7eb; padding: 10px; text-align: left; }
        th { background: #f8fafc; }
        form { display: grid; gap: 10px; }
        label { display: grid; gap: 6px; font-weight: 600; }
        input, select { padding: 9px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
        .alert { padding: 12px 14px; border-radius: 8px; margin-bottom: 12px; }
        .alert.success { background: #dcfce7; color: #166534; }
        .alert.error { background: #fee2e2; color: #991b1b; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
        .badge.allocated { background: #dbeafe; color: #1d4ed8; }
        .badge.released { background: #ecfccb; color: #3f6212; }
        .badge.cancelled { background: #fee2e2; color: #991b1b; }
        .empty { padding: 16px; color: #475569; }
        .inline-actions { display: flex; gap: 8px; }
        button { background: #0f172a; color: #fff; border: none; border-radius: 8px; padding: 8px 10px; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <div style="color: #475569; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;">Operations / Resource Planning</div>
            <h1>Resource Allocation</h1>
        </div>
        <a class="btn secondary" th:href="@{/dashboard}">Back to Dashboard</a>
    </div>

    <div th:if="${successMessage}" class="alert success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert error" th:text="${errorMessage}"></div>

    <div class="grid">
        <section class="panel">
            <h2>Allocation register</h2>
            <table th:if="${!#lists.isEmpty(allocations)}">
                <thead>
                <tr>
                    <th>Request</th>
                    <th>Vehicle</th>
                    <th>Resource</th>
                    <th>Allocated To</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="allocation : ${allocations}">
                    <td th:text="${allocation.requestId}">1</td>
                    <td th:text="${allocation.vehicleId}">V-100</td>
                    <td th:text="${allocation.resourceName}">Truck</td>
                    <td th:text="${allocation.allocatedTo}">Team A</td>
                    <td>
                        <span class="badge" th:classappend="${#strings.toLowerCase(allocation.status)}"
                              th:text="${allocation.status}">Allocated</span>
                    </td>
                    <td>
                        <div class="inline-actions">
                            <form th:action="@{/allocations/{id}/release(id=${allocation.id})}" method="post"
                                  th:if="${#strings.equalsIgnoreCase(allocation.status, 'Allocated')}">
                                <button type="submit">Release</button>
                            </form>
                            <form th:action="@{/allocations/{id}/cancel(id=${allocation.id})}" method="post"
                                  th:if="${#strings.equalsIgnoreCase(allocation.status, 'Allocated')}">
                                <button type="submit">Cancel</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
            <div th:if="${#lists.isEmpty(allocations)}" class="empty">No allocations have been created yet.</div>
        </section>

        <section class="panel">
            <h2>Create allocation</h2>
            <form th:action="@{/allocations}" th:object="${allocation}" method="post">
                <div th:if="${#fields.hasErrors('*')}" class="alert error">
                    <ul>
                        <li th:each="err : ${#fields.errors('*')}"><span th:text="${err}"></span></li>
                    </ul>
                </div>

                <label>
                    Request ID
                    <select th:field="*{requestId}">
                        <option value="">Select approved request</option>
                        <option th:each="request : ${approvedRequests}"
                                th:value="${request.id}"
                                th:text="${request.requestCode + ' - ' + request.requestingUnit}"></option>
                    </select>
                </label>

                <label>
                    Request line item
                    <select th:field="*{requestLineItemId}">
                        <option value="">Select request line item</option>
                        <option th:each="item : ${requestLineItems}"
                                th:value="${item.requestLineItemId}"
                                th:text="${item.label}"></option>
                    </select>
                </label>

                <label>
                    Quantity
                    <input type="number" th:field="*{quantity}" min="1" step="1" placeholder="Quantity" />
                </label>

                <label>
                    Vehicle ID
                    <select th:field="*{vehicleId}">
                        <option value="">Select available vehicle</option>
                        <option th:each="vehicle : ${availableVehicles}"
                                th:value="${vehicle.id}"
                                th:text="${vehicle.name + ' (' + vehicle.vehicleCode + ')'}"></option>
                    </select>
                </label>

                <button type="submit" class="btn">Create allocation</button>
            </form>
        </section>
    </div>
</div>
</body>
</html>
