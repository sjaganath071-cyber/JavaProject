<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | Defense Logistics'">
        Personnel Form
    </title>
    <link rel="stylesheet" th:href="@{/css/personnel.css}">
</head>
<body>

<header class="topbar">
    <a class="brand" th:href="@{/dashboard}">
        <span class="brand-mark">DL</span>
        <span>Defense Logistics</span>
    </a>

    <nav class="topnav">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a class="active" th:href="@{/personnel}">Personnel</a>
        <a th:href="@{/assets}">Assets</a>
        <a th:href="@{/reports/readiness}">Readiness Reports</a>
        <a th:href="@{/notifications}">Notifications</a>
        <a th:href="@{/audit-history}">Audit History</a>
    </nav>
</header>

<main class="page-container narrow-container">

    <div class="page-heading">
        <div>
            <p class="eyebrow">PERSONNEL RECORDS</p>
            <h1 th:text="${pageTitle}">Add Personnel</h1>
            <p class="page-description">
                Enter the personnel information below.
            </p>
        </div>
    </div>

    <div class="alert alert-error"
         th:if="${errorMessage != null}"
         th:text="${errorMessage}"></div>

    <section class="panel">
        <form method="post"
              th:action="${formAction}"
              th:object="${personnel}">

            <div class="form-grid">

                <div class="form-group">
                    <label for="personnelCode">Personnel Code *</label>
                    <input id="personnelCode"
                           type="text"
                           th:field="*{personnelCode}"
                           maxlength="50"
                           required>
                    <small class="field-error"
                           th:errors="*{personnelCode}"></small>
                </div>

                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input id="name"
                           type="text"
                           th:field="*{name}"
                           maxlength="100"
                           required>
                    <small class="field-error"
                           th:errors="*{name}"></small>
                </div>

                <div class="form-group">
                    <label for="role">Role *</label>
                    <input id="role"
                           type="text"
                           th:field="*{role}"
                           maxlength="100"
                           placeholder="Enter role"
                           required>
                    <small class="field-error"
                           th:errors="*{role}"></small>
                </div>

                <div class="form-group">
                    <label for="unit">Unit *</label>
                    <input id="unit"
                           type="text"
                           th:field="*{unit}"
                           maxlength="100"
                           placeholder="Enter assigned unit"
                           required>
                    <small class="field-error"
                           th:errors="*{unit}"></small>
                </div>

                <div class="form-group">
                    <label for="posting">Posting *</label>
                    <input id="posting"
                           type="text"
                           th:field="*{posting}"
                           maxlength="150"
                           placeholder="Enter posting location"
                           required>
                    <small class="field-error"
                           th:errors="*{posting}"></small>
                </div>

                <div class="form-group">
                    <label for="availability">Availability *</label>
                    <select id="availability"
                            th:field="*{availability}"
                            required>
                        <option value="AVAILABLE">Available</option>
                        <option value="ON_DUTY">On Duty</option>
                        <option value="ON_LEAVE">On Leave</option>
                        <option value="UNAVAILABLE">Unavailable</option>
                    </select>
                    <small class="field-error"
                           th:errors="*{availability}"></small>
                </div>

                <div class="form-group full-width">
                    <label class="checkbox-label" for="active">
                        <input id="active"
                               type="checkbox"
                               th:field="*{active}">
                        Active personnel record
                    </label>
                </div>

            </div>

            <div class="form-actions">
                <button class="button button-primary" type="submit">
                    <span th:text="${formMode == 'edit'} ?
                        'Save Changes' : 'Create Personnel'">
                        Create Personnel
                    </span>
                </button>

                <a class="button button-secondary"
                   th:href="@{/personnel}">
                    Cancel
                </a>
            </div>

        </form>
    </section>

</main>

<footer class="footer">
    Defense Logistics &amp; Resource Management
</footer>

</body>
</html>
